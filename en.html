<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075f6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gold Coast Day Trip Guide</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./style.css?v=5">
</head>
<body>
<header><div class="head">
<div class="brand">Gold Coast Trip Guide<small>2026.10.04 · Brisbane ↔ Gold Coast</small></div>
<div><div id="clock" class="clock">--:--<small>Queensland</small></div><div class="langs"><a class="" href="./">KOR</a><a class="on" href="./en.html">ENG</a><a class="" href="./zh-tw.html">繁中</a></div></div>
</div></header>

<main>
<section class="card hero"><div class="pad"><div id="heroEyebrow" class="eyebrow"></div><h1 id="heroTitle"></h1><p id="heroIntro"></p><div class="stats"><div><b>06:45</b><span id="stat1"></span></div><div><b>10:00</b><span id="stat2"></span></div><div><b>19:00</b><span id="stat3"></span></div></div></div></section>
<div class="alert"><span id="alertText"></span> <a id="alertLink" href="https://translink.com.au/updates/1075981" target="_blank"></a></div>\n<div class="fareNote"><span id="fareText"></span> <a id="fareLink" href="https://translink.com.au/tickets-and-fares/50-cent-fares" target="_blank"></a></div>\n\n<section class="card now" id="now"><div class="pad">
<div class="nowGrid"><div><div id="nowKicker" class="kicker"></div><div id="nowTitle" class="nowTitle"></div><div id="nowDesc" class="nowDesc"></div></div><div id="count" class="count"></div></div>
<div class="nextBox"><b id="nextText"></b><div id="distanceText" style="margin-top:3px;color:#6f858b"></div></div>
<div class="whereBox" id="whereText">GPS —</div>
<div class="btns"><button id="gpsOnBtn" class="btn primary" onclick="startGPS()"></button><a id="gBtn" class="btn google" href="#" target="_blank"></a><a id="tBtn" class="btn translink" href="https://jp.translink.com.au/plan-your-journey/journey-planner" target="_blank"></a><button id="nextBtn" class="btn" onclick="focusNext()"></button></div>
<div class="legendBar"><span><i class="legendDot ldTransport"></i><span id="legendTransport"></span></span><span><i class="legendDot ldTour"></i><span id="legendTour"></span></span><span><i class="legendDot ldGps"></i><span id="legendGps"></span></span></div>
</div></section>

<section class="card" id="mapsec">
<div class="pad"><div class="titleRow"><h2 id="mapTitle"></h2><span id="mapTiny" class="tiny"></span></div></div>
<div class="mapWrap"><div id="map" class="map"></div><div id="mapFail" class="mapFail">Map failed to load.<br>Open this site using the GitHub Pages HTTPS address.</div><div id="mapStatus" class="mapStatus"></div>
<div class="mapTools"><button onclick="fitAll()">◎</button><button onclick="focusNext()">➜</button><button onclick="locateMe()">●</button></div></div>
<div class="mapLegend">
<button class="chip transportChip" onclick="focusPlace('central')">🚆 Central</button><button class="chip transportChip" onclick="focusPlace('helensvale')">🚋 Helensvale</button>
<button class="chip tourChip" onclick="focusPlace('burleigh')">🏊 Burleigh</button><button class="chip tourChip" onclick="focusPlace('charis')">🍤 Charis</button><button class="chip tourChip" onclick="focusPlace('surfers')">🏙 Surfers</button><button class="chip tourChip" onclick="focusPlace('rick')">🍽 Rick Shores</button>
</div>
<div class="gpsline"><div><span id="gpsDot" class="gpsdot"></span><b id="gpsMain"></b><div id="gpsSub" style="color:#71848a;margin-top:2px"></div></div><div style="display:flex;gap:5px"><button id="trackBtn" class="btn" style="min-height:36px;width:auto" onclick="startGPS()"></button><button id="followBtn" class="btn" style="min-height:36px;width:auto" onclick="toggleFollow()"></button></div></div>
</section>

<section class="card" id="schedule"><div class="pad"><div class="titleRow"><h2 id="scheduleTitle"></h2><span id="scheduleTiny" class="tiny"></span></div><div class="sectionKey"><b><i class="legendDot ldTransport"></i><span id="legendTransport2"></span></b><b><i class="legendDot ldTour"></i><span id="legendTour2"></span></b></div><div id="scheduleList" class="schedule"></div></div></section>
<section class="card" id="places"><div class="pad"><div class="titleRow"><h2 id="placesTitle"></h2><span id="placesTiny" class="tiny"></span></div><div id="placeList" class="placeGrid"></div></div></section>
<section class="card" id="legs"><div class="pad"><div class="titleRow"><h2 id="legsTitle"></h2><span id="legsTiny" class="tiny"></span></div><div id="legList"></div></div></section>
<section class="card"><div class="pad"><div class="titleRow"><h2 id="linksTitle"></h2><span id="linksTiny" class="tiny"></span></div><div class="routeGrid"><b>R772</b><span><a href="https://jp.translink.com.au/plan-your-journey/timetables/bus/t/r772" target="_blank" style="text-decoration:underline;font-weight:850">Railbus</a></span><b>L1</b><span><a href="https://jp.translink.com.au/plan-your-journey/timetables/tram/t/l1" target="_blank" style="text-decoration:underline;font-weight:850">G:link L1</a></span><b>704</b><span><a href="https://jp.translink.com.au/plan-your-journey/timetables/bus/T/704" target="_blank" style="text-decoration:underline;font-weight:850">Bus 704</a></span><b>Works</b><span><a href="https://translink.com.au/updates/1075981" target="_blank" style="text-decoration:underline;font-weight:850">3–5 Oct update</a></span></div></div></section>
<footer id="footer"></footer>
</main>

<nav class="bottom"><div class="bottomIn">
<button class="nav" onclick="document.getElementById('now').scrollIntoView()"><b>⏱</b><span id="navNow"></span></button>
<button class="nav" onclick="document.getElementById('mapsec').scrollIntoView()"><b>🗺</b><span id="navMap"></span></button>
<button class="nav" onclick="document.getElementById('schedule').scrollIntoView()"><b>🗓</b><span id="navSchedule"></span></button>
<button class="nav" onclick="document.getElementById('places').scrollIntoView()"><b>🏖</b><span id="navPlaces"></span></button>
<button class="nav" onclick="document.getElementById('legs').scrollIntoView()"><b>🚋</b><span id="navTransit"></span></button>
</div></nav>

<script>window.APP_LANG='en';</script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

</body></html>
